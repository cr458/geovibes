  db_variants:
    - name: "split_ivflist_sorted_duckdb_prefetch"
      db_url: "s3://us-west-2.opendata.source.coop/geovibes/search/USA/alabama/2024-01-01-2025-01-01/httpfs/alabama_dino_vit_small_patch16_224_2024_2025_32_16_10/metadata.db"
      prefetch_db_url: "s3://us-west-2.opendata.source.coop/geovibes/experiments/httpfs_codex/embedding_variants/alabama_ivf_layout_v1/embeddings_ivflist_sorted_rg122880.db"
      row_group_cache_url: "s3://us-west-2.opendata.source.coop/geovibes/experiments/httpfs_codex/embedding_variants/alabama_ivf_layout_v1/row_groups_ivflist_sorted_rg122880.parquet"
      geometry_cache_url: "s3://us-west-2.opendata.source.coop/geovibes/search/USA/alabama/2024-01-01-2025-01-01/httpfs/alabama_dino_vit_small_patch16_224_2024_2025_32_16_10/geometry_cache.parquet"

  query_ids: [2660000, 1000000, 4000000]
  query_id_triplets:
    - [78824, 1033427, 4970394]
  label_clicks:
    - {lon: -86.55, lat: 32.35}

workload:
  n_trials: 1
  n_neighbors_values: [1000]
  prefetch_top_k: 1000
  prefetch_fast_k: 100
  nprobe: 1024
  row_group_size: 122880
  pool_scope: "trial"
  run_order: "strategy_major"
  capture_faiss_ids: false
  run_label_queries: false

strategies:
  - name: "split_duckdb_w8"
    metadata_source: "geometry_cache"
    prefetch_method: "rowgroup_cache_threadpool_reuse_conn"
    n_workers: 8
    use_connection_pool: true
    fetch_mode: "fetchall"

  - name: "split_duckdb_w16"
    metadata_source: "geometry_cache"
    prefetch_method: "rowgroup_cache_threadpool_reuse_conn"
    n_workers: 16
    use_connection_pool: true
    fetch_mode: "fetchall"

  - name: "split_duckdb_w32"
    metadata_source: "geometry_cache"
    prefetch_method: "rowgroup_cache_threadpool_reuse_conn"
    n_workers: 32
    use_connection_pool: true
    fetch_mode: "fetchall"

output:
  directory: "results"
