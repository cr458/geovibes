# End-to-end retrieval harness configuration.
# Tuned for the real GeoVibes interaction path over httpfs.

source:
  # FAISS index used for local vector search.
  faiss_url: "s3://us-west-2.opendata.source.coop/geovibes/search/USA/alabama/2024-01-01-2025-01-01/httpfs/alabama_dino_vit_small_patch16_224_2024_2025_32_16_10/faiss.index"

  # One or more DuckDB variants to compare (baseline, reordered, etc.).
  db_variants:
    - name: "baseline"
      db_url: "s3://us-west-2.opendata.source.coop/geovibes/search/USA/alabama/2024-01-01-2025-01-01/httpfs/alabama_dino_vit_small_patch16_224_2024_2025_32_16_10/metadata.db"
      geometry_cache_url: "s3://us-west-2.opendata.source.coop/geovibes/search/USA/alabama/2024-01-01-2025-01-01/httpfs/alabama_dino_vit_small_patch16_224_2024_2025_32_16_10/geometry_cache.parquet"

  # IDs used to construct a stable query vector: q = 2*pos - neg.
  query_ids: [2660000, 1000000, 4000000]

  # Click points used for nearest-point profiling (labeling workflow).
  label_clicks:
    - {lon: -86.55, lat: 32.35}
    - {lon: -86.30, lat: 32.55}
    - {lon: -86.75, lat: 32.70}

workload:
  n_trials: 3
  n_neighbors_values: [500, 1000]
  prefetch_top_k: 500
  nprobe: 64
  row_group_size: 122880

strategies:
  # Reference baseline (no local geometry cache, no row-group batching).
  - name: "baseline_remote_single"
    metadata_source: "remote"
    prefetch_method: "single_query"

  # Closest match to current app pattern.
  - name: "app_current_geomcache_iddiv_newconn"
    metadata_source: "geometry_cache"
    prefetch_method: "id_div_rowgroup_threadpool_new_conn"
    n_workers: 32

  # Isolate connection-reuse effect while keeping current id//row_group batching.
  - name: "opt_geomcache_iddiv_reuse"
    metadata_source: "geometry_cache"
    prefetch_method: "id_div_rowgroup_threadpool_reuse_conn"
    n_workers: 32

  # Proposed optimization: batch by physical row groups using rowid lookup + reused conns.
  - name: "opt_geomcache_rowid_reuse"
    metadata_source: "geometry_cache"
    prefetch_method: "rowid_rowgroup_threadpool_reuse_conn"
    n_workers: 32

  # Preferred optimization: local id->row_group cache to avoid per-query rowid lookup.
  - name: "opt_geomcache_rowgroup_cache_reuse"
    metadata_source: "geometry_cache"
    prefetch_method: "rowgroup_cache_threadpool_reuse_conn"
    n_workers: 32

  # Alternative: one connection, DuckDB internal threading.
  - name: "opt_geomcache_duckdb_threads"
    metadata_source: "geometry_cache"
    prefetch_method: "duckdb_native_threads"
    n_threads: 32

output:
  directory: "results"
